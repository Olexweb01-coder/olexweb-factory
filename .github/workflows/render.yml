# Started by the Olexweb admin (never by hand needed): renders one approved script into a finished Short.
# The only inputs are the script's number and the admin's address; nothing secret travels in them, because the
# runs of a public repo are visible to anyone. The worker proves itself to the admin with the FACTORY_SECRET secret.
name: render
run-name: render video ${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      id: { description: 'Script number', required: true }
      api: { description: 'Admin address', required: true, default: 'https://olexweb.com' }
concurrency: { group: render, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  render:
    runs-on: ubuntu-24.04            # the system the factory was tested on (ubuntu-latest moved to 26 in Oct 2026)
    timeout-minutes: 200             # a long story (5–8 minutes, acted voice) takes about 1½–2½ hours; a Short about 15 minutes
    env:
      OLEX_API: ${{ inputs.api }}
      FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}
    steps:
      - name: Only the Olexweb admin's address is accepted
        run: |
          case "$OLEX_API" in https://olexweb.com|https://www.olexweb.com) ;; *) echo "Refusing to talk to $OLEX_API"; exit 1;; esac
          case "${{ inputs.id }}" in ''|*[!0-9]*) echo "Bad script number"; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Tell the admin we've started
        run: node worker/hello.mjs "${{ inputs.id }}"
      - name: Voice model (cached between runs)
        uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0-full }
      - name: Download the voice model if it isn't cached
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "models/$f" ] || curl -sSfL -o "models/$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done
      - name: Install
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          pip install --quiet kokoro-onnx==0.6.1 soundfile numpy scipy librosa
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Get the job
        run: |
          node worker/run.mjs --id "${{ inputs.id }}" --step job
          echo "KIND=$(node -e "console.log(require('./work/job.json').kind || 'short')")" >> "$GITHUB_ENV"
      # Story Shorts and long stories only: Chatterbox (his acted voice) in its own setup, because it needs numpy 1 and Kokoro numpy 2.
      # Kept between runs, so only the first story run pays the install (about 30 minutes); later runs restore it.
      - name: Chatterbox setup (cached between runs)
        if: env.KIND == 'story' || env.KIND == 'saga'
        uses: actions/cache@v4
        with:
          path: .cbox
          key: cbox-0.1.7-torch2.6.0-ubuntu-24.04
      - name: Chatterbox model (cached between runs)
        if: env.KIND == 'story' || env.KIND == 'saga'
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: chatterbox-hf-v1 }
      - name: Install Chatterbox if it isn't cached
        if: env.KIND == 'story' || env.KIND == 'saga'
        run: |
          if [ ! -x .cbox/bin/python ]; then
            # the first install takes about 30 minutes: keep telling the admin we're alive, so it isn't taken for a stuck run
            ( while true; do sleep 240; node worker/hello.mjs "${{ inputs.id }}" > /dev/null 2>&1 || true; done ) & HB=$!
            python3 -m venv .cbox
            .cbox/bin/pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            .cbox/bin/pip install --quiet chatterbox-tts==0.1.7 soundfile || { echo "Chatterbox didn't install: the backup voice will be used"; rm -rf .cbox; }
            kill $HB 2>/dev/null || true
          fi
      - name: Make the video
        run: node worker/run.mjs --id "${{ inputs.id }}" --step capture,voice,music,render,upload
