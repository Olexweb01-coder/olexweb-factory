# Wakes Olex AI every 10 minutes (free on public repos): the Directory writes new pages, the posting queue goes out on time,
# reminders and scripts run. Needs one repository secret: CRON_SECRET (the same value as in Vercel). Nothing else is stored here.
name: olex-runner
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Run Olex AI
        env: { CRON_SECRET: "${{ secrets.CRON_SECRET }}" }
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add the CRON_SECRET repository secret first."; exit 1; fi
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer $CRON_SECRET" "https://olexweb.com/api/assistant/cron?run=due")
          echo "status $code"; head -c 600 /tmp/out.json; echo
          [ "$code" = "200" ]
