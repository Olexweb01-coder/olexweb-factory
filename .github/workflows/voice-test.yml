# Voice test: started by hand from the Actions tab (Run workflow). It never runs for real videos and uses no secrets.
# It makes the 4 designed voices act 4 lines at 3 emotion levels with Chatterbox (open source, MIT), and saves the
# results as a download ("voice-test") on the run's page.
name: voice-test
on:
  workflow_dispatch:
    inputs:
      designs: { description: 'Which voices: all, or letters like A,C', required: true, default: 'all' }
permissions: { contents: read }
jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check the input
        run: |
          case "${{ inputs.designs }}" in all|[ABCDabcd]|[ABCDabcd],*) ;; *) echo "Use all, or letters like A,C"; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Voice models (cached between runs)
        uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0-full }
      - name: Chatterbox model (cached between runs)
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: chatterbox-hf-v1 }
      - name: Download the Kokoro voice model if it isn't cached
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "models/$f" ] || curl -sSfL -o "models/$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done
      - name: Install (two separate setups; Kokoro needs numpy 2, Chatterbox numpy 1)
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv .kokoro && .kokoro/bin/pip install --quiet kokoro-onnx==0.6.1 soundfile numpy librosa
          python -m venv .cbox
          .cbox/bin/pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .cbox/bin/pip install --quiet chatterbox-tts==0.1.7 soundfile
      - name: Make the voice prints (Kokoro)
        run: .kokoro/bin/python worker/voicetest.py prints "${{ inputs.designs }}"
      - name: Make the voices act (Chatterbox)
        run: .cbox/bin/python worker/voicetest.py act
      - name: Save the results for download
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: voice-test, path: out/voicetest, retention-days: 14, if-no-files-found: warn }
